[project]
name = "econrag"
version = "0.1.0"
description = "Autonomous Portfolio Monitoring Agent"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "requests>=2.31",
    "pandas>=2.1",
    "numpy>=1.26",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
    "yfinance>=0.2",
    "httpx>=0.27",
    "praw>=7.7",
    "crawl4ai>=0.4",
    "lightrag-hku>=1.3.9",
    "networkx>=3.2",
    "ollama>=0.4",
    "google-genai>=1.0",
    "google-api-core>=2.15",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "pydantic>=2.5",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "ta>=0.11",
    "cvxpy>=1.5",
    "scikit-learn>=1.4",
    "osqp>=0.6",
    "scs>=3.2",
    "exchange_calendars>=4.5",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "network: tests that require internet access (deselect with '-m not network')",
]
